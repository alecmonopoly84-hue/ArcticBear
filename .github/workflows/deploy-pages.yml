name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unpack website
        run: |
          mkdir -p site
          unzip -q github-pages-field-service.zip -d site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages path
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_lower="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo_lower="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"

          if [ "$repo_lower" = "${owner_lower}.github.io" ]; then
            pages_base_path=""
          else
            pages_base_path="/${repo_name}"
          fi

          printf 'BASE_PATH=%s\n' "$pages_base_path" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SITE_URL=https://%s.github.io%s\n' "$owner_lower" "$pages_base_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build website
        working-directory: site
        run: npm run build:verify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
