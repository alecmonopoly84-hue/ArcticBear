name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site/parts _site/media
          cp index.html site.css site.js parts-promo.css parts.css parts.js abservice-logo.svg _site/
          cp parts/index.html _site/parts/index.html

          cat image-src-v3/hero.*.b64 | tr -d '\n' | base64 -d > _site/media/hero-abservice.avif
          cat image-src-v3/diag.*.b64 | tr -d '\n' | base64 -d > _site/media/diag-repair-abservice.avif
          cat image-src-v3/field.*.b64 | tr -d '\n' | base64 -d > _site/media/field-service-abservice.avif
          cat image-src-v3/team.*.b64 | tr -d '\n' | base64 -d > _site/media/team-abservice.avif
          cat image-src-v3/closeup.*.b64 | tr -d '\n' | base64 -d > _site/media/closeup-service-abservice.avif

          test "$(stat -c%s _site/media/hero-abservice.avif)" -gt 10000
          test "$(stat -c%s _site/media/diag-repair-abservice.avif)" -gt 10000
          test "$(stat -c%s _site/media/field-service-abservice.avif)" -gt 10000
          test "$(stat -c%s _site/media/team-abservice.avif)" -gt 10000
          test "$(stat -c%s _site/media/closeup-service-abservice.avif)" -gt 10000
          ls -lh _site/media

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
